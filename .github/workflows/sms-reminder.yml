name: SMS reminder for airborne operators

on:
  schedule:
    # רץ פעמיים ביום UTC (14:00 ו-15:00) כדי לכסות שעון קיץ/חורף בישראל.
    # הסקריפט עצמו בודק שהשעה בישראל היא בדיוק 17:00 ומדלג אם לא.
    - cron: "0 14 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch:

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sms-reminder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: node send-reminders.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CELLCOM_USER: ${{ secrets.CELLCOM_USER }}
          CELLCOM_PASS: ${{ secrets.CELLCOM_PASS }}
          CELLCOM_SENDER: ${{ secrets.CELLCOM_SENDER }}
